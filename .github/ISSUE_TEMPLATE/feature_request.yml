name: Feature request
description: Suggest a change to the scanner library or examples.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe the task and who needs this capability.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Integration and alternatives
      description: Note any library API, browser, privacy, accessibility or resource constraints.
