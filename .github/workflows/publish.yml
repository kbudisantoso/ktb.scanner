name: Publish npm package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        type: string
        required: true
      publish:
        description: Publish to npm (leave disabled to build a candidate only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'kbudisantoso/ktb.scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      npm-tag: ${{ steps.release.outputs.npmTag }}
      archive: ${{ steps.release.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: release
        run: node scripts/check-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  secrets-check:
    needs: validate
    uses: ./.github/workflows/secret-scanning.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}

  package:
    needs: [validate, checks, secrets-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Build and inspect the actual release archive
        run: |
          mkdir -p release
          pnpm --filter @ktb-tools/scanner pack --pack-destination "$PWD/release"
          python3 scripts/check-package.py "release/$RELEASE_ARCHIVE"
          cd release
          sha256sum "$RELEASE_ARCHIVE" > SHA256SUMS
        env:
          RELEASE_ARCHIVE: ${{ needs.validate.outputs.archive }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ needs.validate.outputs.version }}
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'release' || inputs.publish == true
    needs: [validate, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ needs.validate.outputs.version }}
          path: release/
      - run: sha256sum --check SHA256SUMS
        working-directory: release
      - name: Check for an identical previous publication
        id: registry
        run: node scripts/check-registry-release.mjs
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      - name: Publish the inspected archive using npm OIDC
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "release/$RELEASE_ARCHIVE" --access public --tag "$NPM_TAG" --provenance --ignore-scripts --registry https://registry.npmjs.org/
        env:
          RELEASE_ARCHIVE: ${{ needs.validate.outputs.archive }}
          NPM_TAG: ${{ needs.validate.outputs.npm-tag }}
      - name: Verify registry bytes
        run: node scripts/check-registry-release.mjs
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          REQUIRE_PUBLISHED: 'true'

  attach:
    if: github.event_name == 'release'
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ needs.validate.outputs.version }}
          path: release/
      - name: Attach the published package and checksum to the GitHub release
        run: gh release upload "$RELEASE_TAG" "release/$RELEASE_ARCHIVE" release/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_ARCHIVE: ${{ needs.validate.outputs.archive }}
