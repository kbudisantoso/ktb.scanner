name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build and quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:core
      - run: pnpm test:release
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:docs
      - run: pnpm check:package
      - run: pnpm licenses:inventory
      - run: pnpm check:notices

  browser:
    name: Browser (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            engine: chromium
          - project: firefox
            engine: firefox
          - project: webkit
            engine: webkit
          - project: mobile-webkit
            engine: webkit
    steps:
      - name: Match ephemeral container home ownership
        run: |
          test "$HOME" = /github/home
          chown "$(id -u):$(id -g)" "$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify image-provided browser
        env:
          SCANNER_TEST_ENGINE: ${{ matrix.engine }}
        run: |
          node --input-type=commonjs <<'NODE'
          const { accessSync, constants } = require('node:fs');
          const browser = require('@playwright/test')[process.env.SCANNER_TEST_ENGINE];
          const { version } = require('@playwright/test/package.json');
          if (version !== '1.64.1') throw new Error('Update the pinned Playwright image and package together.');
          accessSync(browser.executablePath(), constants.X_OK);
          browser.launch().then((instance) => instance.close()).catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
      - name: Provide virtual audio output for Firefox
        if: matrix.engine == 'firefox'
        run: |
          apt-get update
          apt-get install --no-install-recommends --yes pulseaudio pulseaudio-utils
          scanner_pulse_dir=$(mktemp -d "$RUNNER_TEMP/scanner-pulse.XXXXXX")
          install -d -m 700 "$scanner_pulse_dir/runtime" "$scanner_pulse_dir/state" "$scanner_pulse_dir/config"
          export PULSE_RUNTIME_PATH="$scanner_pulse_dir/runtime"
          export PULSE_STATE_PATH="$scanner_pulse_dir/state"
          export PULSE_CONFIG_PATH="$scanner_pulse_dir/config"
          export PULSE_COOKIE="$scanner_pulse_dir/state/cookie"
          pulseaudio --start --exit-idle-time=-1 -n \
            --load="module-native-protocol-unix socket=$PULSE_RUNTIME_PATH/native auth-cookie=$PULSE_COOKIE"
          export PULSE_SERVER="unix:$PULSE_RUNTIME_PATH/native"
          for scanner_pulse_key in PULSE_RUNTIME_PATH PULSE_STATE_PATH PULSE_CONFIG_PATH PULSE_COOKIE PULSE_SERVER; do
            printf '%s=%s\n' "$scanner_pulse_key" "${!scanner_pulse_key}" >> "$GITHUB_ENV"
          done
          pactl load-module module-null-sink sink_name=scanner_tests
          pactl set-default-sink scanner_tests
      - run: pnpm build
      - run: pnpm exec playwright test --project=${{ matrix.project }}
      - name: Retain synthetic failure reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-${{ matrix.project }}
          path: |
            test-results/
            artifacts/local/browser-results.json
          retention-days: 7
          if-no-files-found: ignore

  ci-success:
    name: CI Success
    if: always()
    needs: [quality, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$QUALITY_RESULT" = success && test "$BROWSER_RESULT" = success
