packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  sharp: true
  core-js: false
  protobufjs: false
  tesseract.js: false
# Exact versions reviewed against official source tags and tarball/lockfile integrity on 2026-11-06.
# Remove these narrow exceptions after the 24-hour release-age window.
minimumReleaseAgeExclude:
  - '@astrojs/internal-helpers@0.13.1'
  - '@astrojs/markdown-satteri@0.4.7'
  - '@playwright/test@1.65.0'
  - astro@7.4.7
  - playwright-core@1.65.0
  - playwright@1.65.0
overrides:
  onnxruntime-web: 1.31.1
  onnxruntime-common: 1.31.1
  '@techstark/opencv-js': 4.10.0-release.1
